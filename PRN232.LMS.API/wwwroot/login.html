<body><main style="max-width:560px;margin:6vh auto;padding:24px"><a href="/students">← Danh sách sinh viên</a><h1>Đăng nhập LMS</h1><p>Đăng nhập tài khoản Admin để quản lý sinh viên và đăng ký học.</p>
