services:
  api:
    build:
      context: .
      dockerfile: PRN232.LMS.API/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      ConnectionStrings__Lms: "Server=db;Database=PRN232Lms;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Lab1Only_ChangeMe123!};TrustServerCertificate=True"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Disposable local lab default, never a production credential.
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Lab1Only_ChangeMe123!}"
    volumes:
      - lab-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
volumes:
  lab-data:
